<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 64 64>
  <defs>
    <linearGradient id=cyanGrad x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#38bdf8 />
      <stop offset=100% stop-color=#818cf8 />
    </linearGradient>
    <filter id=glow x=-20% y=-20% width=140% height=140%>
      <feGaussianBlur stdDeviation=1 result=blur />
      <feComposite in=SourceGraphic in2=blur operator=over />
    </filter>
  </defs>

  <!-- Dark Obsidian Background -->
  <rect width=64 height=64 rx=14 fill=#070b14 stroke=#1e293b stroke-width=1.5 />

  <!-- Outer Circuit Network Traces -->
  <g stroke=url(#cyanGrad) stroke-width=1.5 fill=none opacity=0.45>
    <line x1=32 y1=12 x2=32 y2=4 />
    <line x1=32 y1=52 x2=32 y2=60 />
    <line x1=12 y1=32 x2=4 y2=32 />
    <line x1=52 y1=32 x2=60 y2=32 />
    <line x1=18 y1=18 x2=11 y2=11 />
    <line x1=46 y1=18 x2=53 y2=11 />
    <line x1=18 y1=46 x2=11 y2=53 />
    <line x1=46 y1=46 x2=53 y2=53 />
  </g>

  <!-- Network Terminal Dots -->
  <circle cx=32 cy=4 r=2 fill=#38bdf8 />
  <circle cx=32 cy=60 r=2 fill=#818cf8 />
  <circle cx=4 cy=32 r=2 fill=#38bdf8 />
  <circle cx=60 cy=32 r=2 fill=#818cf8 />
  <circle cx=11 cy=11 r=1.5 fill=#38bdf8 />
  <circle cx=53 cy=11 r=1.5 fill=#38bdf8 />
  <circle cx=11 cy=53 r=1.5 fill=#818cf8 />
  <circle cx=53 cy=53 r=1.5 fill=#818cf8 />

  <!-- Outer Hexagonal Topology Frame -->
  <polygon points=32,12 49,22 49,42 32,52 15,42 15,22 fill=rgba(56, 189, 248, 0.08) stroke=url(#cyanGrad) stroke-width=2 stroke-linejoin=round filter=url(#glow) />

  <!-- Stylized Architectural 'A' / Central Processor Core -->
  <path d=M32 17 L43 41 L36.5 41 L34 35.5 L30 35.5 L27.5 41 L21 41 Z M32 24.5 L30.2 31 L33.8 31 Z fill=url(#cyanGrad) />

  <!-- Central Nexus Core -->
  <circle cx=32 cy=33.5 r=2 fill=#ffffff />
</svg>
